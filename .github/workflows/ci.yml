name: CI
on:
  pull_request:
  push:
    branches: [main]

# CI 토큰은 소스 읽기만 필요하다.
permissions:
  contents: read

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소해 CI 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 액션은 태그 탈취에 대비해 커밋 digest로 고정한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
  openapi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # backend는 OpenApiDocsTest가 docs/openapi.json을 정본으로 강제하므로
      # main의 raw 파일과 바이트 비교만으로 드리프트를 판정할 수 있다.
      - name: backend main 스펙과 비교
        run: |
          curl -fsSL https://raw.githubusercontent.com/Cook-Pilot/backend/main/docs/openapi.json -o /tmp/openapi.json
          if ! diff -u docs/openapi.json /tmp/openapi.json; then
            echo "::error::backend main의 openapi.json과 다릅니다. 스펙 변경이 클라이언트(lib/features/*/data/)에 미치는 영향을 확인한 뒤 docs/openapi.json을 갱신하세요."
            exit 1
          fi
